<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b7a86">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مهامي">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>مهامي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@500;700&family=Tajawal:wght@400;500;700&display=swap">
<style>
/* Layout: عمود واحد ضيق في المنتصف، الإدخال فوق، القائمة تحته، الفلاتر والعدّاد في الأسفل */
:root {
  --bg: #eef2f4;
  --surface: #ffffff;
  --fg: #14212b;
  --muted: #62727e;
  --line: #d9e1e6;
  --accent: #0b7a86;
  --accent-fg: #ffffff;
  --accent-soft: #d8eef0;
  --danger: #b4372c;
  --font-display: "Readex Pro", "Tajawal", system-ui, sans-serif;
  --font-body: "Tajawal", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e171d;
    --surface: #17242c;
    --fg: #e6eef2;
    --muted: #8da0ac;
    --line: #26363f;
    --accent: #3cc3d0;
    --accent-fg: #06262a;
    --accent-soft: #14383d;
    --danger: #f08a7e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e171d;
  --surface: #17242c;
  --fg: #e6eef2;
  --muted: #8da0ac;
  --line: #26363f;
  --accent: #3cc3d0;
  --accent-fg: #06262a;
  --accent-soft: #14383d;
  --danger: #f08a7e;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.5;
  padding-block: 24px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap { max-width: 560px; margin-inline: auto; display: flex; flex-direction: column; gap: 18px; }

header { display: flex; flex-direction: column; gap: 4px; }
.date { color: var(--muted); font-size: 15px; }
h1 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 32px; line-height: 1.2; text-wrap: balance; }

.progress { display: flex; flex-direction: column; gap: 8px; }
.progress-text { display: flex; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 15px; }
.progress-text b { color: var(--fg); font-weight: 700; font-variant-numeric: tabular-nums; }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s ease; }

form.add { display: flex; gap: 8px; }
form.add input {
  flex: 1; min-width: 0;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 14px 16px; font-size: 16px;
}
form.add input::placeholder { color: var(--muted); }
form.add button {
  background: var(--accent); color: var(--accent-fg); border: 0; border-radius: 12px;
  padding: 0 20px; font-weight: 700;
}
form.add button:active { transform: scale(.97); }

ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
li {
  display: flex; align-items: center; gap: 12px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 6px 8px 6px 14px;
}
.chk {
  flex: none; width: 28px; height: 28px; border-radius: 50%;
  border: 2px solid var(--muted); background: transparent;
  display: grid; place-items: center; padding: 0;
}
.chk svg { width: 16px; height: 16px; opacity: 0; stroke: var(--accent-fg); }
li.done .chk { background: var(--accent); border-color: var(--accent); }
li.done .chk svg { opacity: 1; }
.txt {
  flex: 1; min-width: 0; background: none; border: 0; text-align: start;
  padding: 10px 0; overflow-wrap: anywhere;
}
li.done .txt { color: var(--muted); text-decoration: line-through; }
.del {
  flex: none; width: 40px; height: 40px; border-radius: 10px; border: 0;
  background: transparent; color: var(--muted); display: grid; place-items: center;
}
.del:hover, .del:focus-visible { color: var(--danger); background: var(--accent-soft); }
.del svg { width: 18px; height: 18px; }

.empty { text-align: center; color: var(--muted); padding: 32px 8px; }

footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.tabs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
.tabs button { border: 0; background: transparent; color: var(--muted); border-radius: 8px; padding: 6px 14px; font-weight: 500; }
.tabs button[aria-pressed="true"] { background: var(--accent-soft); color: var(--fg); font-weight: 700; }
.clear { background: none; border: 0; color: var(--muted); padding: 6px 4px; text-decoration: underline; text-underline-offset: 3px; }
.clear:hover { color: var(--danger); }
.clear[hidden] { display: none; }

.toast {
  position: fixed; inset-inline: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  max-width: 420px; margin-inline: auto;
  background: var(--fg); color: var(--bg); border-radius: 12px; padding: 12px 16px;
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
}
.toast button { background: none; border: 0; color: var(--accent-soft); font-weight: 700; text-decoration: underline; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .toast button { color: var(--accent); } }
:root[data-theme="dark"] .toast button { color: var(--accent); }
@media (prefers-reduced-motion: reduce) { .bar > i { transition: none; } }

html { color-scheme: light; }
body { margin: 0; }
[hidden] { display: none !important; }
.install {
  background: var(--accent-soft); border: 1px solid var(--line); border-radius: 12px;
  padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.install span { font-size: 15px; min-width: 0; }
.install button { background: var(--accent); color: var(--accent-fg); border: 0; border-radius: 10px; padding: 8px 16px; font-weight: 700; flex: none; }
.install .x { background: none; color: var(--muted); padding: 8px; font-weight: 500; }
.ios-tip { color: var(--muted); font-size: 14px; }
</style>
</head>
<body>


<div class="wrap" dir="rtl" lang="ar">
  <div class="install" id="install" hidden>
    <span>ثبّت التطبيق على موبايلك وافتحه زي أي تطبيق.</span>
    <button type="button" id="install-btn">تثبيت</button>
    <button type="button" class="x" id="install-x" aria-label="إخفاء">✕</button>
  </div>
  <div class="ios-tip" id="ios-tip" hidden>على الآيفون: اضغط زر المشاركة ثم "إضافة إلى الشاشة الرئيسية".</div>
  <header>
    <div class="date" id="date"></div>
    <h1>مهامي</h1>
  </header>

  <div class="progress">
    <div class="progress-text"><span id="left-text"></span><span><b id="pct">0</b>٪ تم</span></div>
    <div class="bar" aria-hidden="true"><i id="fill"></i></div>
  </div>

  <form class="add" id="form" autocomplete="off">
    <input id="newtask" type="text" placeholder="اكتب مهمة جديدة…" maxlength="200" aria-label="مهمة جديدة" enterkeyhint="done">
    <button type="submit">إضافة</button>
  </form>

  <ul id="list"></ul>

  <footer>
    <div class="tabs" id="tabs" role="group" aria-label="تصفية المهام">
      <button type="button" data-f="all" aria-pressed="true">الكل</button>
      <button type="button" data-f="open" aria-pressed="false">المتبقي</button>
      <button type="button" data-f="done" aria-pressed="false">المنجز</button>
    </div>
    <button type="button" class="clear" id="clear" hidden>مسح المنجز</button>
  </footer>
</div>

<div class="toast" id="toast" hidden role="status">
  <span id="toast-msg"></span>
  <button type="button" id="undo">تراجع</button>
</div>

<script>
(function () {
  var KEY = "mahamy-todo-v1";
  var tasks = [];
  var filter = "all";
  var lastRemoved = null;
  var toastTimer = null;

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) { var d = JSON.parse(raw); if (Array.isArray(d)) return d; }
    } catch (e) {}
    return null;
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(tasks)); } catch (e) {} }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  var saved = load();
  tasks = saved || [
    { id: uid(), t: "اشتري خبز وخضار من السوق", d: false },
    { id: uid(), t: "ردّ على رسائل الشغل", d: false },
    { id: uid(), t: "مشي نص ساعة", d: true }
  ];

  var $ = function (id) { return document.getElementById(id); };
  var list = $("list"), form = $("form"), input = $("newtask");

  try {
    $("date").textContent = new Date().toLocaleDateString("ar-EG", { weekday: "long", day: "numeric", month: "long" });
  } catch (e) {}

  var CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
  var TRASH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 002 2h6a2 2 0 002-2l1-12M9 7V4h6v3"/></svg>';

  function ar(n) { return n.toLocaleString("ar-EG"); }

  function render() {
    var open = tasks.filter(function (x) { return !x.d; }).length;
    var done = tasks.length - open;
    var pct = tasks.length ? Math.round(done / tasks.length * 100) : 0;
    $("left-text").textContent = tasks.length
      ? (open === 0 ? "خلصت كل المهام" : "فاضل " + ar(open) + (open === 1 ? " مهمة" : open === 2 ? " مهمتين" : open <= 10 ? " مهام" : " مهمة"))
      : "مفيش مهام لسه";
    $("pct").textContent = ar(pct);
    $("fill").style.width = pct + "%";
    $("clear").hidden = done === 0;

    var shown = tasks.filter(function (x) {
      return filter === "all" || (filter === "open" ? !x.d : x.d);
    });

    list.textContent = "";
    if (!shown.length) {
      var e = document.createElement("li");
      e.className = "empty";
      e.style.display = "block";
      e.style.border = "0";
      e.style.background = "none";
      e.textContent = !tasks.length ? "اكتب أول مهمة فوق وبعدين دوس إضافة." : filter === "open" ? "مفيش مهام متبقية." : "لسه ما خلصتش مهمة.";
      list.appendChild(e);
    }
    shown.forEach(function (x) {
      var li = document.createElement("li");
      li.dataset.id = x.id;
      if (x.d) li.className = "done";

      var c = document.createElement("button");
      c.type = "button"; c.className = "chk"; c.dataset.act = "toggle";
      c.setAttribute("aria-label", x.d ? "رجّع المهمة" : "علّم المهمة تمت");
      c.innerHTML = CHECK;

      var t = document.createElement("button");
      t.type = "button"; t.className = "txt"; t.dataset.act = "toggle";
      t.textContent = x.t;

      var d = document.createElement("button");
      d.type = "button"; d.className = "del"; d.dataset.act = "del";
      d.setAttribute("aria-label", "احذف المهمة");
      d.innerHTML = TRASH;

      li.appendChild(c); li.appendChild(t); li.appendChild(d);
      list.appendChild(li);
    });
  }

  function commit() { save(); render(); }

  function toast(msg, withUndo) {
    $("toast-msg").textContent = msg;
    $("undo").hidden = !withUndo;
    $("toast").hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { $("toast").hidden = true; lastRemoved = null; }, 5000);
  }

  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    var v = input.value.trim();
    if (!v) { input.focus(); return; }
    tasks.unshift({ id: uid(), t: v, d: false });
    input.value = "";
    if (filter === "done") setFilter("all");
    commit();
    input.focus();
  });

  list.addEventListener("click", function (ev) {
    var b = ev.target.closest("button[data-act]");
    if (!b) return;
    var li = b.closest("li");
    var i = tasks.findIndex(function (x) { return x.id === li.dataset.id; });
    if (i < 0) return;
    if (b.dataset.act === "toggle") {
      tasks[i].d = !tasks[i].d;
      commit();
    } else {
      lastRemoved = { task: tasks[i], index: i };
      tasks.splice(i, 1);
      commit();
      toast("تم حذف المهمة", true);
    }
  });

  $("undo").addEventListener("click", function () {
    if (!lastRemoved) return;
    tasks.splice(Math.min(lastRemoved.index, tasks.length), 0, lastRemoved.task);
    lastRemoved = null;
    $("toast").hidden = true;
    commit();
  });

  function setFilter(f) {
    filter = f;
    Array.prototype.forEach.call($("tabs").children, function (b) {
      b.setAttribute("aria-pressed", String(b.dataset.f === f));
    });
  }
  $("tabs").addEventListener("click", function (ev) {
    var b = ev.target.closest("button[data-f]");
    if (!b) return;
    setFilter(b.dataset.f);
    render();
  });

  $("clear").addEventListener("click", function () {
    var n = tasks.filter(function (x) { return x.d; }).length;
    tasks = tasks.filter(function (x) { return !x.d; });
    commit();
    toast("تم مسح " + ar(n) + " من المنجز", false);
  });

  render();
})();

(function () {
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
  var standalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone;
  if (standalone) return;
  var dismissed = false;
  try { dismissed = localStorage.getItem("mahamy-install-x") === "1"; } catch (e) {}
  var deferred = null;
  window.addEventListener("beforeinstallprompt", function (e) {
    e.preventDefault();
    deferred = e;
    if (!dismissed) document.getElementById("install").hidden = false;
  });
  document.getElementById("install-btn").addEventListener("click", function () {
    if (!deferred) return;
    deferred.prompt();
    deferred.userChoice.finally(function () {
      deferred = null;
      document.getElementById("install").hidden = true;
    });
  });
  document.getElementById("install-x").addEventListener("click", function () {
    document.getElementById("install").hidden = true;
    try { localStorage.setItem("mahamy-install-x", "1"); } catch (e) {}
  });
  window.addEventListener("appinstalled", function () {
    document.getElementById("install").hidden = true;
  });
  var ua = navigator.userAgent || "";
  if (/iphone|ipad|ipod/i.test(ua) && !dismissed) document.getElementById("ios-tip").hidden = false;
})();
</script>

</body>
</html>
